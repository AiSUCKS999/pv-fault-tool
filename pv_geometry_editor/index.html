<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;color:#dbeafe;font:14px system-ui;background:#0d1728} .bar{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
button{background:#18334e;color:#e0f2fe;border:1px solid #41637e;padding:9px 12px;border-radius:6px;cursor:pointer}button.primary{background:#075985}canvas{display:block;max-width:100%;touch-action:none;background:#111827;border-radius:7px}#status{line-height:1.5;color:#cbd5e1}
</style></head><body><div class="bar"><button id="save" class="primary">Save corrected module</button><button id="add">Draw new module (4 corners)</button><button id="remove">Remove selected module</button><button id="reset">Reset draft</button></div><div id="status">Drag the four corners to the physical frame, then save.</div><canvas id="canvas"></canvas><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'); let args={},image=new Image(),quad=[],draft=[],adding=false,drag=-1,scaleX=1,scaleY=1,edge=-1,last=null;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function height(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
function value(action,extra={}){send('streamlit:setComponentValue',{value:{action,event_id:Date.now()+':'+Math.random(),module_id:args.selected_id,source_identity:args.source_identity,revision:args.revision,...extra},dataType:'json'})}
function point(q){return[(q[0]-args.origin[0])*scaleX,(q[1]-args.origin[1])*scaleY]}
function line(q,color,width=1){if(!q.length)return;ctx.beginPath();q.forEach((p,i)=>{const[x,y]=point(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(q.length===4)ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);(args.neighbors||[]).forEach(q=>line(q,'rgba(56,189,248,.4)')); const q=adding?draft:quad;line(q,'#4ade80',2);q.forEach((p,i)=>{const[x,y]=point(p);ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle='#0f172a';ctx.fill();ctx.strokeStyle='#4ade80';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText(i+1,x+10,y-8)});height()}
function pos(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}
function source(p){return[p[0]/scaleX+args.origin[0],p[1]/scaleY+args.origin[1]]}
function clamp(p){return[Math.max(0,Math.min(args.source_size[0]-1,p[0])),Math.max(0,Math.min(args.source_size[1]-1,p[1]))]}
canvas.onpointerdown=e=>{const p=pos(e);drag=-1;edge=-1;if(adding){if(draft.length<4)draft.push(clamp(source(p)));draw();return}let dist=16;quad.forEach((q,i)=>{const a=point(q),d=Math.hypot(p[0]-a[0],p[1]-a[1]);if(d<dist){dist=d;drag=i}});if(drag<0){dist=10;quad.forEach((q,i)=>{const a=point(q),b=point(quad[(i+1)%4]),dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);if(d<dist){dist=d;edge=i}})}if(drag>=0||edge>=0){last=source(p);canvas.setPointerCapture(e.pointerId)}};
canvas.onpointermove=e=>{if(drag<0&&edge<0)return;const p=source(pos(e));if(drag>=0)quad[drag]=clamp(p);else{const delta=[p[0]-last[0],p[1]-last[1]];[edge,(edge+1)%4].forEach(i=>quad[i]=clamp([quad[i][0]+delta[0],quad[i][1]+delta[1]]));last=p}draw()};canvas.onpointerup=canvas.onpointercancel=()=>{drag=-1;edge=-1;last=null};
document.getElementById('save').onclick=()=>{const q=adding?draft:quad;if(q.length!==4){document.getElementById('status').textContent='Place all four corners in perimeter order first.';return}value(adding?'add':'save',{polygon:q})};
document.getElementById('add').onclick=()=>{adding=true;draft=[];document.getElementById('status').textContent='Click the four physical module corners in perimeter order, then save. Do not trace internal cell lines.';draw()};
document.getElementById('remove').onclick=()=>{if(args.selected_id)value('remove')};
document.getElementById('reset').onclick=()=>{adding=false;quad=JSON.parse(JSON.stringify(args.polygon||[]));document.getElementById('status').textContent='Drag corner handles to the physical module frame, then save.';draw()};
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;args=e.data.args;quad=JSON.parse(JSON.stringify(args.polygon||[]));draft=[];adding=false;drag=-1;edge=-1;document.getElementById('save').disabled=!!e.data.disabled;image.onload=()=>{const fit=Math.min(1,850/image.width,620/image.height);canvas.width=Math.round(image.width*fit);canvas.height=Math.round(image.height*fit);scaleX=canvas.width/args.crop_size[0];scaleY=canvas.height/args.crop_size[1];draw()};image.src=args.image;document.getElementById('status').textContent=(args.selected_id||'New geometry')+' · '+args.detail+' · Drag corners or edges to the physical frame, then save.'});
send('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
