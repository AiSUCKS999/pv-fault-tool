<!doctype html><html><head><meta charset="utf-8"><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#000}</style></head><body>
<iframe id="display" allow="fullscreen" allowfullscreen title="PV presentation controls"></iframe>
<script>
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let signature=null;
window.addEventListener('message',event=>{
 if(event.data.type==='streamlit:render'){
  if(signature!==event.data.args.signature){signature=event.data.args.signature;document.getElementById('display').srcdoc=event.data.args.html;}
  send('streamlit:setFrameHeight',{height:540});
 }
 if(event.source===document.getElementById('display').contentWindow && event.data.type==='pv-operator-state')
  send('streamlit:setComponentValue',{value:{...event.data.state,signature:event.data.signature},dataType:'json'});
});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
